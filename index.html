    <title>Yoel | Portafolio en construcción</title>
    <script>
      // Aplicar el tema antes del primer render evita un destello del tema opuesto.
      (() => {
        let savedTheme = null;
        try { savedTheme = localStorage.getItem('yoel-theme'); } catch { /* Almacenamiento restringido. */ }
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0F172A' : '#F8FAFC';
      })();
    </script>
